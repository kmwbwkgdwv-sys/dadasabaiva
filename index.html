<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ダダサバイバー - ロビー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>ダダサバイバー</h1><div class="coin">🪙 <span id="coins">0</span></div></header>
<main>
  <section id="lobby" class="tab">
    <div id="room" hidden></div>
    <div id="subs">
      <div class="seg"><button data-sub="stage" class="on">ステージ選択</button><button data-sub="join">ロビーに参加</button></div>
      <div id="sub-stage">
        <div id="stages" class="stages"></div>
        <label>パスワード（空なら自動）<input id="cpw" maxlength="8" placeholder="1234"></label>
        <button id="create" class="pri">このステージでロビー作成</button>
      </div>
      <div id="sub-join" hidden>
        <label>ロビーID<input id="jid" inputmode="numeric" maxlength="4" placeholder="0000"></label>
        <label>パスワード<input id="jpw" maxlength="8"></label>
        <button id="join" class="pri">参加（最大4人）</button>
        <p id="msg" class="msg"></p>
      </div>
    </div>
  </section>

  <section id="gacha" class="tab" hidden>
    <div class="pull">
      <button class="pri" data-n="1">1回<br>🪙 3,000</button>
      <button class="pri" data-n="10">10回<br>🪙 30,000</button>
    </div>
    <table class="rates" id="rates"></table>
    <button id="reset" class="sub">セーブをリセット</button>
  </section>

  <section id="equip" class="tab" hidden>
    <div id="slots" class="slotsrow"></div>
    <div id="sum" class="sum"></div>
    <div id="inv" class="grid"></div>
  </section>
</main>
<div id="result" hidden></div>
<nav>
  <button data-tab="lobby" class="on">🏠<span>ロビー</span></button>
  <button data-tab="gacha">🎰<span>ガチャ</span></button>
  <button data-tab="equip">🛡️<span>装備</span></button>
</nav>
<script src="js/items.js"></script>
<script src="js/main.js"></script>
</body>
</html>
